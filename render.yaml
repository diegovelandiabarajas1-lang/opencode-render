# Blueprint de Render: Wichinion (motor propio de Wichi) en el plan gratuito, sin tarjeta.
# La contraseña la genera Render (OPENCODE_SERVER_PASSWORD, nombre heredado que Wichinion entiende): léela en el panel,
# Environment, y escríbela en la app. No va en este archivo.
services:
  - type: web
    name: opencode-movil
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: OPENCODE_SERVER_PASSWORD
        generateValue: true
      - key: OPENCODE_PORT
        value: "10000"
      - key: PORT
        value: "10000"
    autoDeployTrigger: commit
    envVars:
      - key: OPENCODE_SERVER_PASSWORD
        generateValue: true
      - key: MOTOR_PORT
        value: "10000"
      - key: PORT
        value: "10000"
