# Blueprint de Render: OpenCode para OpenCode Móvil (plan gratuito, sin tarjeta).
# La contraseña la genera Render (variable OPENCODE_SERVER_PASSWORD): léela en el panel,
# Environment, y escríbela en la app. No va en este archivo.
services:
  - type: web
    name: opencode-movil
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    envVars:
      - key: OPENCODE_SERVER_PASSWORD
        generateValue: true
      - key: OPENCODE_PORT
        value: "10000"
      - key: PORT
        value: "10000"

